# Verification Arbitrage: Default Configuration
# Run: python -m src.async_pipeline --config configs/default.yaml

# Pipeline settings
pipeline:
  test_size: 50
  base_price: 100.0
  position_size: 1000
  use_moa: false
  use_three_tier: true
  use_vwap_unwind: false
  use_hedge_layer: false

# Latency budgets (ms): none,T1,T2
latency_budgets: "none,5000,1000"

# LLM settings
llm:
  provider: "deepseek"
  model: "deepseek-chat"
  temperature: 0.0
  max_tokens: 512

# Market simulation parameters
market:
  liquidity_profile: "mid"  # high, mid, low
  panic_drop_pct: 0.018
  sustained_dislocation_pct: 0.030
  impact_coefficient: 0.50
  volatility: 0.25
  enable_air_pockets: true

# Data paths
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  synthetic_dir: "data/synthetic"
  output_dir: "results"

# Risk controls
risk:
  hold_threshold: 0.35   # P(fake) ≤ 0.35 → hold
  hedge_threshold: 0.65  # 0.35 < P(fake) < 0.65 → hedge
  circuit_breaker_assets: 2
  circuit_breaker_window_s: 60
